name: Pipeline CI-CD solerdiaz

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      ejecutar_cobertura:
        description: "Ejecutar informe de cobertura"
        required: true
        default: "si"
        type: choice
        options:
          - "si"
          - "no"

  schedule:
    - cron: "0 7 * * 1"

env:
  DOCKER_IMAGE: angelsddev/practica7-cicd

jobs:
  calidad-y-pruebas:
    name: Analisis de calidad y pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter
        run: npm run lint

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Ejecutar cobertura
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.ejecutar_cobertura == 'si' }}
        run: npm run coverage

  security-scan:
    name: Analisis de seguridad con ClamAV
    runs-on: ubuntu-latest
    needs: calidad-y-pruebas

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar y actualizar ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo freshclam || true

      - name: Ejecutar analisis de seguridad
        run: ./scripts/security_scan.sh

  build:
    name: Construccion del artefacto
    runs-on: ubuntu-latest
    needs: [calidad-y-pruebas, security-scan]

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Construir artefacto
        run: npm run build

      - name: Publicar artefacto dist
        uses: actions/upload-artifact@v4
        with:
          name: practica7-dist
          path: dist/

  docker-images:
    name: Construir y publicar imagenes Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen Debian
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile_debian
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:debian
            ${{ env.DOCKER_IMAGE }}:debian-${{ github.sha }}

      - name: Construir y publicar imagen Alpine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile_alpine
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:alpine
            ${{ env.DOCKER_IMAGE }}:alpine-${{ github.sha }}

  deploy:
    name: Despliegue continuo en optativa
    runs-on: [self-hosted, optativa, docker, deploy]
    needs: docker-images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Verificar Docker en runner self-hosted
        run: |
          docker --version
          docker compose version
          docker ps

      - name: Ejecutar despliegue automatico
        run: ./scripts/deploy.sh

      - name: Ejecutar prueba post-despliegue
        run: ./scripts/post_deploy_check.sh
