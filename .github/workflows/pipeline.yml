name: Pipeline CI-CD solerdiaz

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      ejecutar_cobertura:
        description: "Ejecutar informe de cobertura"
        required: true
        default: "si"
        type: choice
        options:
          - "si"
          - "no"

  schedule:
    - cron: "0 7 * * 1"

env:
  DOCKER_IMAGE: angelsddev/practica7-cicd

jobs:
  calidad-y-pruebas:
    name: Analisis de calidad y pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar linter
        run: npm run lint

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Ejecutar cobertura
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.ejecutar_cobertura == 'si' }}
        run: npm run coverage

  security-scan:
    name: Analisis de seguridad con ClamAV
    runs-on: ubuntu-latest
    needs: calidad-y-pruebas

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar y actualizar ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam || true
          sudo mkdir -p /var/lib/clamav
          sudo freshclam --verbose
          ls -l /var/lib/clamav

      - name: Ejecutar analisis de seguridad
        run: ./scripts/security_scan.sh

  build:
    name: Construccion del artefacto
    runs-on: ubuntu-latest
    needs: [calidad-y-pruebas, security-scan]

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Construir artefacto
        run: npm run build

      - name: Publicar artefacto dist
        uses: actions/upload-artifact@v4
        with:
          name: practica7-dist
          path: dist/

  docker-images:
    name: Construir y publicar imagenes Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen Debian
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile_debian
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:debian
            ${{ env.DOCKER_IMAGE }}:debian-${{ github.sha }}

      - name: Construir y publicar imagen Alpine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile_alpine
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:alpine
            ${{ env.DOCKER_IMAGE }}:alpine-${{ github.sha }}

  deploy:
    name: Despliegue continuo en optativa
    runs-on: [self-hosted, optativa, docker, deploy]
    needs: docker-images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Verificar Docker en runner self-hosted
        run: |
          docker --version
          docker compose version
          docker ps

      - name: Ejecutar despliegue automatico
        run: ./scripts/deploy.sh

      - name: Ejecutar prueba post-despliegue
        run: ./scripts/post_deploy_check.sh

  notify:
    name: Notificacion por correo
    runs-on: ubuntu-latest
    needs: [calidad-y-pruebas, security-scan, build, docker-images, deploy]
    if: always()

    steps:
      - name: Enviar correo de resultado del pipeline
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          NEEDS_CONTEXT: ${{ toJson(needs) }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          ACTOR_NAME: ${{ github.actor }}
        run: |
          python3 <<'PY'
          import json
          import os
          import smtplib
          from email.message import EmailMessage

          needs = json.loads(os.environ["NEEDS_CONTEXT"])

          failed_jobs = [
              name for name, data in needs.items()
              if data.get("result") != "success"
          ]

          if failed_jobs:
              status = "ERROR"
              subject = "ERROR - Pipeline CI/CD Practica 7"
              result_text = "El pipeline ha terminado con errores."
          else:
              status = "OK"
              subject = "OK - Pipeline CI/CD Practica 7"
              result_text = "El pipeline ha terminado correctamente."

          lines = [
              "Resultado del pipeline CI/CD - Practica 7",
              "",
              f"Estado general: {status}",
              f"Detalle: {result_text}",
              "",
              f"Rama: {os.environ['BRANCH_NAME']}",
              f"Commit: {os.environ['COMMIT_SHA']}",
              f"Usuario que lanzó el pipeline: {os.environ['ACTOR_NAME']}",
              f"URL de ejecución: {os.environ['RUN_URL']}",
              "",
              "Resultados por job:"
          ]

          for name, data in needs.items():
              lines.append(f"- {name}: {data.get('result')}")

          if failed_jobs:
              lines.append("")
              lines.append("Jobs con error o no completados:")
              for job in failed_jobs:
                  lines.append(f"- {job}")

          msg = EmailMessage()
          msg["From"] = os.environ["SMTP_USERNAME"]
          msg["To"] = os.environ["NOTIFICATION_EMAIL"]
          msg["Subject"] = subject
          msg.set_content("\n".join(lines))

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"])
              smtp.send_message(msg)

          print("Correo de notificación enviado correctamente")
          PY
